<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS og styles.css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Order Songs</title>
</head>

<body>
    <!-- MAIN PAGE LAYOUT -->
<div id="page-layout">

    <!-- LEFT MENU -->
    <div class="left-menu">
        <div id="logo">
            <img id="admin-trigger" class="logo" src="../images/logo.png" alt="Jukebox Logo" style="cursor: pointer;">
        </div>

        <!-- LEFT MENU BUTTONS -->
        <div class="menu-buttons">
                <a href="index.html"><i class="bi bi-house me-2"></i>Home</a>
                <a href="order-songs.html" class="active"><i class="bi bi-music-note-beamed me-2"></i>Order Song</a>
            </div>
    </div> <!-- END OF LEFT MENU -->

    <!-- Main/middle content -->
    <div id="main-content">

        <div class="header">
            <h1>Order Songs</h1>
        </div>

        <!-- searchbar -->
        <div class="topnav">
        <input type="text" id="songSearch" placeholder="Search for a song or an artist..">
        </div>

        <!-- Empty div for the song list -->
        <div id="song-list"></div>

    </div>

    <!-- RIGHT SIDEBAR (PRISER OG KØ) -->
    <div class="right-sidebar">
        <div id="prices1" class="prices1">
            <h3>
                <img src="../images/coin.svg.svg" alt="Coin">
                Prices
            </h3>
            <p>1 Song - 2 kr</p>
            <p>3 Songs - 5 kr</p>
        </div>

        <!-- Shopping cart section -->
        <div id="kurv" class="kurv">
            <h3>Shopping Cart</h3>
            <div id="cart-songs"></div>
            <div id="delete-songs"></div>
            <div id="total-songs"></div>
        </div>
<!-- 1. Knappen der åbner betalingsvinduet -->
        <button type="button" class="btn btn-success btn-lg" data-bs-toggle="modal" data-bs-target="#betalingsModal">
        Go to checkout
        </button>
    </div>

</div>

<!-- 2. Selve Pop-up'en (Modal) med betalingsmodul -->
    <div class="modal fade" id="betalingsModal">
        <div class="modal-dialog">
            <div class="modal-content">
            
                <!-- Top med titel og luk-knap -->
                <div class="modal-header">
                    <h5 class="modal-title" id="betalingsModalLabel">Scan the QR-code to pay with MobilePay</h5>
                </div>
            
            <!-- Indhold / Betalingsmodul -->
                <div class="modal-body">
                    <form>
                    <!-- Beløb til betaling -->
                    <div class="alert alert-info py-2 mb-3">
                        Amount: <span id="payment-total">0 kr</span>
                    </div>
                <div class="QR-KODE">
                    <img class="logo" src="/images/QRKODEN.png" alt="QRKODE" style="max-width: 200px; height: auto; display: block; margin: 0 auto;">
                </div>
                
                <!-- Knapper i bunden -->
                    <div class="modal-footer justify-content-between">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuller</button>
                        <button id="confirm-payment" type="button" class="btn btn-primary">Confirm</button>
                    </div>
                </div>
            </div>
        </div>
    
    </div>
         
<!-- Bootstrap Modal / Pop-up til Admin Menu -->
<div class="modal fade" id="adminModal" tabindex="-1" aria-labelledby="adminModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="background-color: #2a1b3d; color: white; border: 2px solid #a2528b;">
            <div class="modal-header">
                <h5 class="modal-title" id="adminModalLabel">Admin Menu</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center">
                <p>Velkommen til admin-styrepanelet!</p>
                <button class="btn btn-danger m-2">Pause / Afspil</button>
                <button class="btn btn-warning m-2">Spring sang over</button>
                <button id="reset-queue" class="btn btn-secondary m-2">Nulstil</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="mainScript.js"></script>
<script src="songList.js"></script>

</body>
</html>
